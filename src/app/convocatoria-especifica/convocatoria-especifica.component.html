<div class="container-fluid">
  <div class="row">
    <div class="col-md-2" >
      <h1> <a [routerLink]="['']"> <i class="bi bi-arrow-left-square icon"></i> </a> </h1>
    </div>
    <div class="col-md-8 col-sm-12 background" style="display: grid; place-items: center; align-items: start;">
      <main *ngIf="convocatoriaEspecificaPost$ | async as convoEsp">
            <h1>{{ convoEsp.fields.tituloConvocatoria }}</h1>
            <p>{{ convoEsp.fields.descripcionConvocatoria }}</p>
            <iframe
            [src]="getSafeUrl(convoEsp.fields.oficioConvocatoria.fields.file.url)"
            width="100%"
            height="700px"
            style="border: none;"
            allowfullscreen
            ></iframe>
      </main>
    </div>
    <div class="col-md-2"></div>
  </div>
</div>
